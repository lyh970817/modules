# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "custom_gctacreatemgrmmanifest"
description: Write the GCTA GRM roots of a focal analysis to a natural-sorted MGRM manifest
keywords:
  - genome-wide complex trait analysis
  - gcta
  - genomic relationship matrix
  - grm
  - multiple genomic relationship matrix
  - mgrm
  - manifest
  - genetics
tools:
  - "custom_gctacreatemgrmmanifest":
      description: "A static nf-core helper for constructing GCTA multiple-GRM manifests."
      homepage: "https://github.com/nf-core/modules"
      documentation: "https://yanglab.westlake.edu.cn/software/gcta/#DataManagement"
      tool_dev_url: "https://github.com/nf-core/modules"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy map containing the focal analysis metadata
          e.g. `[ id:'analysis1' ]`
    - grm_files:
        type: file
        description: |
          Complete GCTA binary GRM bundles for every stratum of one focal analysis, with one
          .grm.id, .grm.bin and .grm.N.bin file per root. The manifest lists the GRM roots in
          natural-sorted (`sort -V`) order of their staged basenames.
        pattern: "*.grm.{id,bin,N.bin}"
        ontologies: []
output:
  mgrm_bundle:
    - - meta:
          type: map
          description: |
            Groovy map containing the focal analysis metadata
            e.g. `[ id:'analysis1' ]`
      - "${prefix}.mgrm":
          type: file
          description: |
            GCTA multiple-GRM manifest containing one staged GRM root per line, in natural-sorted
            GRM prefix order
          pattern: "${prefix}.mgrm"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Text
      - grm_files:
          type: file
          description: Complete GCTA binary GRM bundles referenced by the manifest
          pattern: "*.grm.{id,bin,N.bin}"
          ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
authors:
  - "@andongni"
maintainers:
  - "@andongni"
