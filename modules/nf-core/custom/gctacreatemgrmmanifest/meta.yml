# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "custom_gctacreatemgrmmanifest"
description: Validate complete GCTA GRM bundles and write their roots to an ordered MGRM manifest
keywords:
  - gcta
  - grm
  - mgrm
  - manifest
  - genetics
tools:
  - "custom_gctacreatemgrmmanifest":
      description: "A static nf-core helper for constructing validated GCTA multiple-GRM manifests."
      homepage: "https://github.com/nf-core/modules"
      documentation: "https://yanglab.westlake.edu.cn/software/gcta/#DataManagement"
      tool_dev_url: "https://github.com/nf-core/modules"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy map containing the focal analysis metadata
          e.g. `[ id:'analysis1' ]`
    - grm_files:
        type: file
        description: Complete GCTA binary GRM bundles, with one .grm.id, .grm.bin and .grm.N.bin file per root
        pattern: "*.grm.{id,bin,N.bin}"
        ontologies: []
    - grm_order:
        type: list
        description: Ordered unique staged GRM root basenames, without paths or the .grm suffix
output:
  mgrm_bundle:
    - - meta:
          type: map
          description: |
            Groovy map containing the focal analysis metadata
            e.g. `[ id:'analysis1' ]`
      - "${prefix}.mgrm":
          type: file
          description: Ordered GCTA multiple-GRM manifest containing one staged GRM root per line
          pattern: "${prefix}.mgrm"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Text
      - grm_files:
          type: file
          description: Validated complete GCTA binary GRM bundles referenced by the manifest
          pattern: "*.grm.{id,bin,N.bin}"
          ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing the static helper version
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing the static helper version
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
authors:
  - "@andongni"
maintainers:
  - "@andongni"
