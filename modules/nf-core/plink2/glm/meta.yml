# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "plink2_glm"
description: Run PLINK 2 marker-by-marker linear, logistic, logistic-Firth hybrid, or Firth association analysis
keywords:
  - plink2
  - glm
  - association
  - gwas
tools:
  - "plink2":
      description: "Whole genome association analysis toolset designed for large-scale genetic analyses."
      homepage: "https://www.cog-genomics.org/plink/2.0/"
      documentation: "https://www.cog-genomics.org/plink/2.0/assoc"
      tool_dev_url: "https://github.com/chrchang/plink-ng"
      licence: ["GPL-3.0-or-later"]
      identifier: "biotools:plink"
input:
  - - meta:
        type: map
        description: |
          Groovy map containing PLINK 2 genotype metadata
          e.g. `[ id:'plink_simulated' ]`
    - pgen:
        type: file
        description: PLINK 2 binary genotype file; must share its basename with the PSAM and PVAR files
        pattern: "*.pgen"
        ontologies: []
    - psam:
        type: file
        description: PLINK 2 sample information file; must share its basename with the PGEN and PVAR files
        pattern: "*.psam"
        ontologies: []
    - pvar:
        type: file
        description: PLINK 2 variant information file; must share its basename with the PGEN and PSAM files
        pattern: "*.pvar"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy map containing phenotype metadata for the same genotype/sample identity
          e.g. `[ id:'plink_simulated_quantitative' ]`
    - phenotype:
        type: file
        description: PLINK phenotype file; phenotype-column selectors are supplied through module arguments
        pattern: "*.{phe,pheno,txt,tsv}"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
  - - meta3:
        type: map
        description: |
          Groovy map containing covariate metadata for the same genotype/sample identity
          e.g. `[ id:'plink_simulated_covariates' ]`
    - covariates:
        type: file
        optional: true
        description: Optional PLINK covariate file; pass `[]` when absent and explicitly enable `allow-no-covars`
        pattern: "*.{covar,cov,txt,tsv}"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
output:
  linear:
    - - meta:
          type: map
          description: |
            Groovy map containing genotype metadata
            e.g. `[ id:'plink_simulated' ]`
      - ${prefix}.*.glm.linear:
          type: file
          description: Quantitative-trait linear regression results
          pattern: "*.glm.linear"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  logistic:
    - - meta:
          type: map
          description: |
            Groovy map containing genotype metadata
            e.g. `[ id:'plink_simulated' ]`
      - ${prefix}.*.glm.logistic:
          type: file
          description: Binary-trait logistic regression results produced with the `no-firth` modifier
          pattern: "*.glm.logistic"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  logistic_hybrid:
    - - meta:
          type: map
          description: |
            Groovy map containing genotype metadata
            e.g. `[ id:'plink_simulated' ]`
      - ${prefix}.*.glm.logistic.hybrid:
          type: file
          description: Binary-trait logistic regression results with Firth fallback enabled
          pattern: "*.glm.logistic.hybrid"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  firth:
    - - meta:
          type: map
          description: |
            Groovy map containing genotype metadata
            e.g. `[ id:'plink_simulated' ]`
      - ${prefix}.*.glm.firth:
          type: file
          description: Binary-trait Firth regression results produced with the `firth` modifier
          pattern: "*.glm.firth"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  log:
    - - meta:
          type: map
          description: |
            Groovy map containing genotype metadata
            e.g. `[ id:'plink_simulated' ]`
      - ${prefix}.log:
          type: file
          description: PLINK 2 association analysis log
          pattern: "*.log"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Text
  versions_plink2:
    - - "${task.process}":
          type: string
          description: The process the version was collected from
      - "plink2":
          type: string
          description: The tool name
      - "plink2 --version 2>&1 | sed 's/^PLINK v//; s/ 64.*\\$//'":
          type: eval
          description: The command used to retrieve the PLINK 2 version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the version was collected from
      - plink2:
          type: string
          description: The tool name
      - "plink2 --version 2>&1 | sed 's/^PLINK v//; s/ 64.*\\$//'":
          type: eval
          description: The command used to retrieve the PLINK 2 version
authors:
  - "@andongni"
maintainers:
  - "@andongni"
containers:
  conda:
    linux/amd64:
      lock_file: "modules/nf-core/plink2/glm/.conda-lock/linux_amd64-bd-e6710830a4b7f0c6_1.txt"
  docker:
    linux/amd64:
      build_id: "bd-e6710830a4b7f0c6_1"
      name: "community.wave.seqera.io/library/plink2:2.0.0a.6.9--e6710830a4b7f0c6"
      scan_id: "sc-c6b7ce6ed60d6033_1"
  singularity:
    linux/amd64:
      build_id: "bd-038e91647305849b_1"
      name: "oras://community.wave.seqera.io/library/plink2:2.0.0a.6.9--038e91647305849b"
      https: "https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/22/22dd30b4bc53d1ba88fcd146a2dd562659c9aaa3f0f1712542fb2b4048b454b7/data"
