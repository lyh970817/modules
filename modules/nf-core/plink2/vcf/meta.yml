# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "plink2_vcf"
description: Import VCF genotype data into a PLINK 2 PGEN/PVAR/PSAM fileset
keywords:
  - plink2
  - vcf
  - pgen
  - genotype
tools:
  - "plink2":
      description: "Whole genome association analysis toolset designed for large-scale genetic analyses."
      homepage: "https://www.cog-genomics.org/plink/2.0/"
      documentation: "https://www.cog-genomics.org/plink/2.0/input"
      tool_dev_url: "https://github.com/chrchang/plink-ng"
      licence: ["GPL-3.0-or-later"]
      identifier: "biotools:plink"
input:
  - - meta:
        type: map
        description: |
          Groovy map containing genotype metadata
          e.g. `[ id:'plink_simulated' ]`
    - vcf:
        type: file
        description: VCF genotype file, optionally gzip-compressed
        pattern: "*.{vcf,vcf.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_3016" # VCF
output:
  pgen:
    - - meta:
          type: map
          description: |
            Groovy map containing genotype metadata
            e.g. `[ id:'plink_simulated' ]`
      - "${prefix}.pgen":
          type: file
          description: PLINK 2 binary genotype file
          pattern: "*.pgen"
          ontologies: []
      - "${prefix}.psam":
          type: file
          description: PLINK 2 sample information file
          pattern: "*.psam"
          ontologies: []
      - "${prefix}.pvar":
          type: file
          description: Uncompressed PLINK 2 variant information file
          pattern: "*.pvar"
          ontologies: []
  log:
    - - meta:
          type: map
          description: |
            Groovy map containing genotype metadata
            e.g. `[ id:'plink_simulated' ]`
      - "${prefix}.log":
          type: file
          description: PLINK 2 VCF import log
          pattern: "*.log"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Text
  versions_plink2:
    - - "${task.process}":
          type: string
          description: The process the version was collected from
      - "plink2":
          type: string
          description: The tool name
      - "plink2 --version 2>&1 | sed 's/^PLINK v//; s/ 64.*\\$//'":
          type: eval
          description: The command used to retrieve the PLINK 2 version
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The process the version was collected from
      - plink2:
          type: string
          description: The tool name
      - "plink2 --version 2>&1 | sed 's/^PLINK v//; s/ 64.*\\$//'":
          type: eval
          description: The command used to retrieve the PLINK 2 version
authors:
  - "@nebfield"
maintainers:
  - "@nebfield"
containers:
  conda:
    linux/amd64:
      lock_file: "modules/nf-core/plink2/vcf/.conda-lock/linux_amd64-bd-e6710830a4b7f0c6_1.txt"
  docker:
    linux/amd64:
      build_id: "bd-e6710830a4b7f0c6_1"
      name: "community.wave.seqera.io/library/plink2:2.0.0a.6.9--e6710830a4b7f0c6"
      scan_id: "sc-c6b7ce6ed60d6033_1"
  singularity:
    linux/amd64:
      build_id: "bd-038e91647305849b_1"
      name: "oras://community.wave.seqera.io/library/plink2:2.0.0a.6.9--038e91647305849b"
      https: "https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/22/22dd30b4bc53d1ba88fcd146a2dd562659c9aaa3f0f1712542fb2b4048b454b7/data"
